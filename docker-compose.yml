# SECURITY: Datastore ports (5432/6379/6333/7474/7687) are published here for
# local development convenience. In production they MUST NOT be exposed outside
# localhost — bind them to 127.0.0.1 (e.g. "127.0.0.1:5432:5432") or drop the
# published ports entirely and reach datastores over the internal Docker network.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kortex}
      POSTGRES_DB: kortex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kortex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # SECURITY: In production set REDIS_PASSWORD and run redis with
    # `command: redis-server --requirepass ${REDIS_PASSWORD}`, then update the
    # REDIS_URL / CELERY_*_URL below to redis://:${REDIS_PASSWORD}@redis:6379/<db>.
    # Left unauthenticated here so local `make up` keeps working unchanged.
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image ships neither curl nor wget; use a bash /dev/tcp probe
      test: ["CMD-SHELL", "bash -c ': < /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-kortexgraph}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kortex:${POSTGRES_PASSWORD:-kortex}@postgres:5432/kortex
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kortexgraph}
    volumes:
      - ./apps/api:/app_src
      - ./pipelines:/pipelines
      - ./agents:/app/agents
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --beat --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kortex:${POSTGRES_PASSWORD:-kortex}@postgres:5432/kortex
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kortexgraph}
    volumes:
      - ./apps/api:/app_src
      - ./pipelines:/pipelines
      - ./agents:/app/agents
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
